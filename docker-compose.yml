services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docubrain
      POSTGRES_USER: docubrain
      POSTGRES_PASSWORD: docubrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubrain -d docubrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: api
      args:
        VITE_RAG_API_URL: ${VITE_RAG_API_URL:-http://localhost:8000}
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: docubrain
      DB_USERNAME: docubrain
      DB_PASSWORD: docubrain
      AI_ENGINE_URL: http://ai-service:8000
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"

  web:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: web
      args:
        VITE_RAG_API_URL: ${VITE_RAG_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://docubrain:docubrain@db:5432/docubrain
      PHOENIX_TRACING_ENABLED: ${PHOENIX_TRACING_ENABLED:-true}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-docubrain}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  postgres_data:
  laravel_storage:
  model_cache:
